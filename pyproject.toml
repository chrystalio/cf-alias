[project]
name = "cf-alias"
version = "0.4.0"
description = "Cloudflare Email Forwarding Alias Manager"
requires-python = ">=3.10"

dependencies = [
    "cloudflare",
    "python-dotenv",
    "questionary>=2.0",
    "rich",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pyright",
]

[project.scripts]
cf-alias = "cf_alias:main"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
fixable = ["ALL"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingTypeStubs = false